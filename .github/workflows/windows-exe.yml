name: windows-exe

# Builds a standalone Windows executable from the AnalyzerX backend.
#
# The Android app is React Native and its native modules (Local AI runtime, keychain, filesystem)
# are Android-only, so a react-native-windows desktop build would require replacing that stack.
# The backend, however, is pure Node — node: builtins, express and tRPC, no native modules — so it
# packages cleanly into a single self-contained .exe. This workflow produces exactly that.
#
# Free on a public repository: standard GitHub-hosted runners cost nothing for public repos.

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-exe.yml"

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle the server into one self-contained CommonJS file
        shell: bash
        run: |
          npx esbuild server/_core/index.ts \
            --platform=node \
            --bundle \
            --format=cjs \
            --outfile=dist/server-bundle.cjs \
            --external:pg-native \
            --log-level=warning

      - name: Package the bundle as a Windows executable
        shell: bash
        run: |
          npx --yes @yao-pkg/pkg dist/server-bundle.cjs \
            --target node22-win-x64 \
            --output dist/AnalyzerX-Server.exe

      - name: Verify the executable and record its checksum
        shell: pwsh
        run: |
          $exe = "dist/AnalyzerX-Server.exe"
          if (-not (Test-Path $exe)) { throw "The Windows executable was not produced." }
          $item = Get-Item $exe
          if ($item.Length -lt 5000000) { throw "The executable is implausibly small ($($item.Length) bytes)." }
          Write-Host "Executable size: $($item.Length) bytes"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          "$hash  AnalyzerX-Server.exe" | Out-File -Encoding ascii dist/AnalyzerX-Server.exe.sha256

      - name: Smoke test — the binary must start and report a listening port
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/AnalyzerX-Server.exe"
          $env:PORT = "3999"
          $env:NODE_ENV = "production"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput dist/out.log -RedirectStandardError dist/err.log
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Host "--- stdout ---"; Get-Content dist/out.log -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content dist/err.log -ErrorAction SilentlyContinue
            throw "The executable exited immediately (code $($p.ExitCode))."
          }
          Write-Host "The executable started and stayed running."
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: analyzerx-windows-exe
          path: |
            dist/AnalyzerX-Server.exe
            dist/AnalyzerX-Server.exe.sha256
          if-no-files-found: error
