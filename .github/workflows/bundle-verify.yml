name: Bundle verification

# Verifies the workspace resolves and the JavaScript bundle assembles, using standard native tooling.
# The bundle is produced by Gradle through the committed `android/` project — the same path the release
# workflow uses — so no web-export step is involved.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # A docs-only change cannot alter the bundle.
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install (lockfile must match package.json)
        run: pnpm install --frozen-lockfile

      - name: Type-check each workspace package
        run: pnpm -r --filter "./packages/**" run typecheck

      - name: Type-check the application
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Provision Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Assemble the debug APK (this is the bundle verification)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx2200m -XX:MaxMetaspaceSize=512m"
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          CI: "1"

      - name: Assert the bundle was actually produced
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$apk" || { echo "Gradle produced no APK, so the bundle did not assemble"; exit 1; }
          ls -la "$apk"
          echo "Bundle verified via Gradle: $apk"
