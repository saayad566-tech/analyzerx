name: AnalyzerX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      # Not pinned to a single version: any v-prefixed tag triggers a build.
      # (The release assets this job creates are tagged `apk-<version>-<run>`,
      # which does not match `v*`, so publishing cannot re-trigger the job.)
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
      - name: Read the authoritative release version
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const v = require("./release-version.json");
            if (!v.version || !Number.isInteger(v.androidVersionCode)) {
              console.error("release-version.json is missing version or androidVersionCode");
              process.exit(1);
            }
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_ENV, `ANALYZERX_VERSION=${v.version}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `ANALYZERX_VERSION_CODE=${v.androidVersionCode}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `ANALYZERX_IOS_BUILD=${v.iosBuildNumber}\n`);
          '
          echo "Building AnalyzerX ${ANALYZERX_VERSION} (version code ${ANALYZERX_VERSION_CODE})"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Provision Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
      - run: pnpm release:verify
        env:
          ANALYZERX_SOURCE_REVISION: ${{ github.sha }}
      - run: pnpm release:verify:local-ai
      - run: pnpm check
      - name: Run tests and record evidence
        shell: bash
        env:
          ANALYZERX_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set +e
          mkdir -p artifacts
          npx vitest run --reporter=default --reporter=json --outputFile.json=artifacts/vitest-raw.json
          code=$?
          # Record the result (even a failing one) bound to this revision, then
          # fail the step if the suite failed. The evidence file is not committed.
          node scripts/record-test-results.mjs artifacts/vitest-raw.json > /dev/null 2>&1 || true
          exit $code
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx2200m -XX:MaxMetaspaceSize=512m" -Dkotlin.daemon.jvm.options="-Xmx768m"
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          CI: "1"
      - name: Sign APK with v2 and v3 schemes
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          keytool -genkeypair -v \
            -keystore /tmp/analyzerx-release.keystore \
            -storepass analyzerx-build-password \
            -keypass analyzerx-build-password \
            -alias analyzerx \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=AnalyzerX ${ANALYZERX_VERSION} Release, OU=Mobile, O=AnalyzerX, L=Local, ST=Local, C=IN"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$apk" "$apk.aligned"
          mv "$apk.aligned" "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/analyzerx-release.keystore \
            --ks-pass pass:analyzerx-build-password \
            --key-pass pass:analyzerx-build-password \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          rm -f /tmp/analyzerx-release.keystore
      - name: Generate artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          node scripts/checksum-artifact.mjs "$apk"
      - name: Release-readiness gate (version, manifest, artifact, checksum, signing)
        shell: bash
        env:
          ANALYZERX_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          node scripts/release-readiness.mjs --artifact "$apk"
      - name: Publish signed APK as a release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir=android/app/build/outputs/apk/release
          tag="apk-${ANALYZERX_VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            "$dir/app-release.apk" \
            "$dir/app-release.apk.sha256" \
            --title "AnalyzerX ${ANALYZERX_VERSION} · build ${GITHUB_RUN_NUMBER}" \
            --notes "CI-built, v2/v3-signed release APK from ${GITHUB_SHA}." \
            --latest
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: analyzerx-${{ env.ANALYZERX_VERSION }}-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: ignore
      - name: Stage APK on an artifact branch
        shell: bash
        run: |
          set -euo pipefail
          dir=android/app/build/outputs/apk/release
          mkdir -p apk-out
          cp "$dir/app-release.apk" "apk-out/analyzerx-${ANALYZERX_VERSION}.apk"
          cp "$dir/app-release.apk.sha256" "apk-out/analyzerx-${ANALYZERX_VERSION}.apk.sha256"
          split -b 4194304 -d -a 3 "apk-out/analyzerx-${ANALYZERX_VERSION}.apk" "apk-out/analyzerx-${ANALYZERX_VERSION}.apk.part"
          ls -la apk-out
          git config user.email "ci@analyzerx.local"
          git config user.name "AnalyzerX CI"
          git branch -D apk-artifact 2>/dev/null || true
          git checkout --orphan apk-artifact
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f apk-out
          git commit -m "AnalyzerX ${ANALYZERX_VERSION} signed release APK (build ${GITHUB_RUN_NUMBER})"
          git push --force origin apk-artifact
