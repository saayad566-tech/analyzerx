name: AnalyzerX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v3.2.0"
    # A docs-only change does not need a signed APK built for it.
    paths-ignore:
      - "**.md"

# Least privilege by default; the job raises it only where it must publish a release.
permissions:
  contents: read

# Cancel a superseded run instead of queueing minutes behind it.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Provision Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          # Point Gradle at the SDK. This used to be a separate step whose only command was an echo.
          echo "sdk.dir=$SDK" > android/local.properties
      - run: pnpm release:verify
        env:
          ANALYZERX_SOURCE_REVISION: ${{ github.sha }}
      - run: pnpm check
      - run: pnpm test -- --run
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx2200m -XX:MaxMetaspaceSize=512m" -Dkotlin.daemon.jvm.options="-Xmx768m"
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          CI: "1"
      - name: Sign APK with v2 and v3 schemes
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          keytool -genkeypair -v \
            -keystore /tmp/analyzerx-release.keystore \
            -storepass analyzerx-build-password \
            -keypass analyzerx-build-password \
            -alias analyzerx \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=AnalyzerX 3.2.0 Release, OU=Mobile, O=AnalyzerX, L=Local, ST=Local, C=IN"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$apk" "$apk.aligned"
          mv "$apk.aligned" "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/analyzerx-release.keystore \
            --ks-pass pass:analyzerx-build-password \
            --key-pass pass:analyzerx-build-password \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          rm -f /tmp/analyzerx-release.keystore
      - name: Generate artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          node scripts/checksum-artifact.mjs "$apk"
      - name: Publish signed APK as a release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir=android/app/build/outputs/apk/release
          tag="apk-3.2.0-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            "$dir/app-release.apk" \
            "$dir/app-release.apk.sha256" \
            --title "AnalyzerX 3.2.0 - build ${GITHUB_RUN_NUMBER}" \
            --notes "CI-built, v2/v3-signed release APK from ${GITHUB_SHA}." \
            --latest
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: analyzerx-3.2.0-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk.sha256
          # Actions artifact storage is shared across the whole account. Without a
          # retention cap these ~34 MB APKs accumulate indefinitely and exhaust the
          # account quota, which breaks artifact uploads in every other repository.
          # The signed APK is already preserved as a release asset and on the
          # apk-artifact branch, so a 1-day retention loses nothing.
          retention-days: 1
          if-no-files-found: ignore
      - name: Stage APK on an artifact branch
        shell: bash
        run: |
          set -euo pipefail
          dir=android/app/build/outputs/apk/release
          mkdir -p apk-out
          cp "$dir/app-release.apk" apk-out/analyzerx-3.2.0.apk
          cp "$dir/app-release.apk.sha256" apk-out/analyzerx-3.2.0.apk.sha256
          split -b 4194304 -d -a 3 apk-out/analyzerx-3.2.0.apk apk-out/analyzerx-3.2.0.apk.part
          ls -la apk-out
          git config user.email "ci@analyzerx.local"
          git config user.name "AnalyzerX CI"
          git branch -D apk-artifact 2>/dev/null || true
          git checkout --orphan apk-artifact
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f apk-out
          git commit -m "AnalyzerX 3.2.0 signed release APK (build ${GITHUB_RUN_NUMBER})"
          git push --force origin apk-artifact
