name: AnalyzerX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v3.2.0"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Provision Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
      - run: pnpm release:verify
        env:
          ANALYZERX_SOURCE_REVISION: ${{ github.sha }}
      - name: Market isolation gate
        run: node scripts/check-market-isolation.mjs
      - run: pnpm check
      - run: pnpm test -- --run
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx2200m -XX:MaxMetaspaceSize=512m" -Dkotlin.daemon.jvm.options="-Xmx768m"
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          CI: "1"
      - name: Sign APK with v2 and v3 schemes
        shell: bash
        env:
          # A stable signing key is mandatory for in-place upgrades. Android
          # refuses to update an app whose signing certificate changed, failing
          # with INSTALL_FAILED_UPDATE_INCOMPATIBLE (-7), "Conflicting app
          # signatures". This step previously ran `keytool -genkeypair` on every
          # build, so EVERY release was signed with a brand-new key and no build
          # could ever upgrade another.
          #
          # With ANDROID_KEYSTORE_BASE64 set, that stable release key is used.
          # Without it, the APK keeps the signature Gradle already applied from
          # the committed android/app/debug.keystore — also stable across builds.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/analyzerx-release.keystore
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$apk" "$apk.aligned"
            mv "$apk.aligned" "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks /tmp/analyzerx-release.keystore \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required when ANDROID_KEYSTORE_BASE64 is set}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk"
            rm -f /tmp/analyzerx-release.keystore
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set: keeping Gradle's stable signature from android/app/debug.keystore."
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          # Print the signer certificate so key stability across builds is auditable.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | head -6
      - name: Generate artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          node scripts/checksum-artifact.mjs "$apk"
      - name: Publish signed APK as a release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir=android/app/build/outputs/apk/release
          VERSION="$(node -p "require('./package.json').version")"
          tag="apk-${VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            "$dir/app-release.apk" \
            "$dir/app-release.apk.sha256" \
            --title "AnalyzerX ${VERSION} · build ${GITHUB_RUN_NUMBER}" \
            --notes "CI-built, v2/v3-signed release APK for AnalyzerX ${VERSION} from ${GITHUB_SHA}." \
            --latest
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: analyzerx-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: ignore
      - name: Stage APK on an artifact branch
        shell: bash
        run: |
          set -euo pipefail
          dir=android/app/build/outputs/apk/release
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p apk-out
          cp "$dir/app-release.apk" "apk-out/analyzerx-${VERSION}.apk"
          cp "$dir/app-release.apk.sha256" "apk-out/analyzerx-${VERSION}.apk.sha256"
          split -b 4194304 -d -a 3 "apk-out/analyzerx-${VERSION}.apk" "apk-out/analyzerx-${VERSION}.apk.part"
          # The split parts exist precisely because the whole APK is too big for git.
          # Committing the unsplit file as well gets the push rejected outright:
          #   "File apk-out/analyzerx-3.24.0.apk is 105.90 MB; this exceeds GitHub's
          #    file size limit of 100.00 MB"  -> pre-receive hook declined
          # So only the parts and the checksum are committed. The full APK is already
          # published as a release asset and uploaded as a workflow artifact.
          rm -f "apk-out/analyzerx-${VERSION}.apk"
          ls -la apk-out
          git config user.email "ci@analyzerx.local"
          git config user.name "AnalyzerX CI"
          git branch -D apk-artifact 2>/dev/null || true
          git checkout --orphan apk-artifact
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f apk-out
          git commit -m "AnalyzerX ${VERSION} signed release APK (build ${GITHUB_RUN_NUMBER})"
          git push --force origin apk-artifact
