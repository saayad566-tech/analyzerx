// Bare React Native Gradle settings. No Expo autolinking plugin: the last three Expo packages
// (expo, expo-notifications, expo-audio) have been removed, so nothing in the graph needs
// `expo.modules.plugin` any more. Notifications are handled by @notifee/react-native and voice
// recording by react-native-audio-recorder-player, both of which autolink through the standard
// React Native mechanism below.
pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
}

plugins {
  id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'AnalyzerX'

include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
